name: soundshare
description: SoundShare - Connect multiple audio devices and share the same audio.
publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Bluetooth
  flutter_blue_plus: ^1.35.3

  # Permissions
  permission_handler: ^11.3.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Typography
  google_fonts: ^6.2.1

  # Preferences
  shared_preferences: ^2.3.3

  # App info
  package_info_plus: ^8.1.3

  # Utilities
  collection: ^1.18.0

  # Shimmer loading effects (replaces custom skeleton loader)
  shimmer: ^3.0.0

  # Native Google Play in-app review
  in_app_review: ^2.0.9

  # Google Play Core in-app updates
  in_app_update: ^4.2.3

  # URL launching (Play Store, links)
  url_launcher: ^6.3.1

  # Native share sheet
  share_plus: ^10.1.4

  # QR code generation for broadcast URL
  qr_flutter: ^4.1.0

  # Network connectivity monitoring
  connectivity_plus: ^6.1.1

  # Keep screen on during audio sharing
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/soundshare_logo.png
    - assets/images/app_icon.png
