name: soundshare
description: SoundShare - Connect multiple audio devices and share the same audio.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Bluetooth
  flutter_blue_plus: ^1.35.3

  # Permissions
  permission_handler: ^11.3.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Typography
  google_fonts: ^6.2.1

  # Preferences
  shared_preferences: ^2.3.3

  # App info
  package_info_plus: ^8.1.3

  # Utilities
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/soundshare_logo.png
    - assets/images/app_icon.png
