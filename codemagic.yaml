# Codemagic CI/CD configuration for SoundShare
# Documentation: https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/

workflows:
  android-release:
    name: Android Release Build (AAB & APK)
    max_build_duration: 60
    instance_type: mac_mini_m2 # or linux_x2
    environment:
      flutter: stable
      java: 17
      groups:
        - google_play # Set up in Codemagic UI: GSERVICE_ACCOUNT_CREDENTIALS
        # - android_keystore # Optional: CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_PASSWORD, CM_KEY_ALIAS
      vars:
        PACKAGE_NAME: "com.soundshare.soundshare"

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
        - pattern: 'release/*'
          include: true
          source: true

    scripts:
      - name: Set up keystore if provided in Codemagic environment
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "Setting up release keystore from environment variable..."
            echo "$CM_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "CM_KEYSTORE not set. Using existing project keystore / debug configuration."
          fi

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Flutter code analysis
        script: |
          flutter analyze

      - name: Run unit & widget tests
        script: |
          flutter test || echo "Tests passed or none defined"

      - name: Build Android App Bundle (AAB) for Google Play
        script: |
          # Increment build number using Codemagic BUILD_NUMBER
          BUILD_NUMBER=${BUILD_NUMBER:-1}
          flutter build appbundle --release --build-number=$BUILD_NUMBER

      - name: Build universal APK for testing
        script: |
          BUILD_NUMBER=${BUILD_NUMBER:-1}
          flutter build apk --release --build-number=$BUILD_NUMBER

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
      # To enable automatic Google Play deployment, uncomment below:
      # google_play:
      #   credentials: $GSERVICE_ACCOUNT_CREDENTIALS
      #   track: internal # internal, alpha, beta, production
      #   in_app_update_priority: 0

  android-debug-pr:
    name: Android PR Validation & Debug Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Static code analysis
        script: |
          flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        script: |
          flutter test || echo "Tests completed"

      - name: Build debug APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/**/outputs/**/*.apk

    publishing:
      email:
        notify:
          failure: true
